services:
  extraction-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - WORKERS=${WORKERS:-10}
      - DB_PATH=/data/jobs.db
      - UPLOAD_DIR=/data/uploads
    volumes:
      # Job DB and uploaded files survive container restarts, so queued jobs are not lost
      - job-data:/data
    restart: unless-stopped

volumes:
  job-data:
